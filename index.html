<title>Americano FC</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#14201a;--mu:#5d6b63;--ac:#14804a;--ac2:#e6f4ec;--bd:#dde3de;--dn:#b3261e;--rd:#d92323;--yl:#a16207;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#18211c;--tx:#e8efe9;--mu:#98a79e;--ac:#3fbf7f;--ac2:#1d3226;--bd:#2a3730;--dn:#f2877f;--rd:#a81b1b;--yl:#facc15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#18211c;--tx:#e8efe9;--mu:#98a79e;--ac:#3fbf7f;--ac2:#1d3226;--bd:#2a3730;--dn:#f2877f;--rd:#a81b1b;--yl:#facc15;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
.hd{display:flex;align-items:center;gap:14px;background:var(--rd);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;border-bottom:5px solid var(--ac)}.hd img{height:56px;width:auto}.hd h1{font-size:22px;margin:0;line-height:1.1}.hd p{margin:3px 0 0;font-size:13px;opacity:.92}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-top:8px;text-align:center}.kp b{display:block;font-size:22px}.kp span{font-size:12px;color:var(--mu)}.kp .gf b{color:var(--ac)}.kp .gt b{color:var(--dn)}tr.me td{background:var(--ac2)}.tl{display:inline-block;width:1.7em;height:1.3em;object-fit:contain;vertical-align:-.3em;margin-right:6px}.lg{display:inline-block;width:1.7em;height:1.1em;background:var(--logo) center/contain no-repeat;vertical-align:-.15em;margin-right:6px}.card.rw{border-left:5px solid #16a34a;background-image:linear-gradient(90deg,rgba(22,163,74,.14),transparent 45%)}.card.re{border-left:5px solid #eab308;background-image:linear-gradient(90deg,rgba(234,179,8,.18),transparent 45%)}.card.rl{border-left:5px solid #dc2626;background-image:linear-gradient(90deg,rgba(220,38,38,.14),transparent 45%)}.bw,.kw{color:var(--ac)}.be,.ke{color:var(--yl)}.bl,.kl{color:var(--dn)}.kp>div{padding:8px 4px;border-radius:10px}.kp>div.kw{background:rgba(22,163,74,.14)}.kp>div.ke{background:rgba(234,179,8,.18)}.kp>div.kl{background:rgba(220,38,38,.14)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
button,input,select{font:inherit;color:inherit}
.tab{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);border-radius:10px;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:5px 12px;border:1px solid var(--bd);background:var(--card);border-radius:99px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.dt{font-size:13px;color:var(--mu)}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}
.tm{flex:1;font-weight:600}
.tm.r{text-align:right}
.sc{font-size:22px;font-weight:700;min-width:70px;text-align:center}
.sc.vs{font-size:14px;color:var(--mu);font-weight:500}
.gl{font-size:13px;color:var(--mu);margin-top:8px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:16px 0 8px}
.btn{padding:7px 12px;border:1px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer;font-size:14px}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
a.btn{text-decoration:none;display:inline-block;color:inherit}
a.btn.p{color:#fff}
.btn.d{color:var(--dn)}
.act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
input,select{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);min-width:0}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f .w{grid-column:1/-1}
details.card summary{cursor:pointer;font-weight:600}
.sr{display:grid;grid-template-columns:1fr 1fr 64px 30px;gap:6px;margin-top:6px}
.sn{width:56px;text-align:center}
.ed{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);text-transform:uppercase}
td.n,th.n{text-align:center}
td.g{font-weight:700;color:var(--ac);text-align:center;font-size:18px}
.em{text-align:center;color:var(--mu);padding:28px 8px}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
.warn{color:var(--dn)}
#inst{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;max-width:696px;margin:0 auto;background:#0f1923;border:1px solid #223140;border-radius:18px;padding:14px 16px 16px;box-shadow:0 10px 32px rgba(0,0,0,.45);color:#f1f5f9;animation:instUp .35s ease-out}
@keyframes instUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#inst[hidden]{display:none}
#inst .ih{display:flex;align-items:center;gap:14px}
#inst .ic{flex:none;width:44px;height:44px;border-radius:12px;background:#22c55e;display:flex;align-items:center;justify-content:center}
#inst .it{flex:1;min-width:0}
#inst .it b{display:block;font-size:16px;color:#f1f5f9}
#inst .it p{margin:2px 0 0;font-size:14px;line-height:1.35;color:#94a3b8}
#inst .ix{flex:none;align-self:flex-start;background:none;border:0;padding:4px;cursor:pointer;color:#94a3b8;line-height:0}
#inst .ig{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px;border-radius:12px;border:1px solid rgba(34,197,94,.45);background:rgba(34,197,94,.12);color:#22c55e;font-weight:700;font-size:16px;cursor:pointer}
#inst .ig:active{background:rgba(34,197,94,.22)}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={matches:[]},canEdit=false,mode='wait',tab='jogos',flt='todos',grp='mes',selTeam='',editing=null,draft=null,docRef=null;
const played=m=>m.hs!=null&&m.as!=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const fdate=(d,t)=>{if(!d)return'Data a definir';const [y,mo,da]=d.split('-').map(Number);const x=new Date(y,mo-1,da);return x.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})+(t?' · '+t:'')};
const key=m=>(m.date||'9999')+(m.time||'');
const mine=n=>/americano|^afc$/i.test((n||'').trim());
const LOGO=document.querySelector('.hd img').src;document.documentElement.style.setProperty('--logo','url("'+LOGO+'")');
const EXT=['png','jpg','jpeg','webp','svg','gif','avif','jfif','PNG','JPG','JPEG','WEBP'],LG={};let LMAP={};
const slug=n=>(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const HASEXT=/\.(png|jpe?g|webp|svg|gif|avif|jfif)$/i;
function logoOk(i){LG[i.dataset.s]=i.getAttribute('src')}
function logoErr(i){const s=i.dataset.s;
  const fb=()=>{if(i.dataset.b!==s||i.dataset.m){delete i.dataset.m;i.dataset.b=s;i.dataset.i=0;i.src='logos/'+s+'.'+EXT[0];return true}return false};
  if(i.dataset.m){if(fb())return;LG[s]=null;i.remove();return}
  const k=+i.dataset.i+1;
  if(k<EXT.length){i.dataset.i=k;i.src='logos/'+i.dataset.b+'.'+EXT[k]}
  else if(!fb()){LG[s]=null;i.remove()}}
function logoTag(n){const s=slug(n);if(!s||LG[s]===null)return'';let src=LG[s],m='',b=s;if(!src){if(LMAP[s]){const v=LMAP[s];if(HASEXT.test(v)){src='logos/'+encodeURI(v);m=' data-m="1"'}else{b=encodeURI(v);src='logos/'+b+'.'+EXT[0]}}else src='logos/'+s+'.'+EXT[0]}return '<img class="tl" src="'+src+'" alt="" data-s="'+s+'" data-b="'+b+'" data-i="0"'+m+' onload="logoOk(this)" onerror="logoErr(this)">'}
const tn=n=>mine(n)?'<i class="lg"></i>'+esc(n):logoTag(n)+esc(n);
const BADGE={w:'✅ Vitória',e:'🟨 Empate',l:'❌ Derrota'};
function resOf(m){if(!played(m))return'';const h=mine(m.home),a=mine(m.away);if(!h&&!a)return'';const f=h?m.hs:m.as,c=h?m.as:m.hs;return f>c?'w':f<c?'l':'e'}
function clubStats(ms){const r={j:0,v:0,e:0,d:0,gf:0,gt:0};ms.forEach(m=>{const h=mine(m.home),a=mine(m.away);if(!h&&!a)return;const f=h?m.hs:m.as,c=h?m.as:m.hs;r.j++;r.gf+=f;r.gt+=c;if(f>c)r.v++;else if(f<c)r.d++;else r.e++});return r}
function clubLine(ms){const c=clubStats(ms);return c.j?`<div class="hint">${tn('Americano FC')}: ✅ ${c.v} vitória(s) · 🟨 ${c.e} empate(s) · ❌ ${c.d} derrota(s) · GP ${c.gf} · GC ${c.gt} · saldo ${c.gf-c.gt>0?'+':''}${c.gf-c.gt}</div>`:''}

function persist(){
  if(mode==='db'&&docRef){docRef.set({matches:S.matches}).catch(()=>alert('Não foi possível salvar. Verifique se você tem permissão de edição.'))}
  else{try{localStorage.setItem('fut',JSON.stringify(S))}catch(e){}}
  render();
}

function scorers(){
  const map={};
  S.matches.filter(played).forEach(m=>(m.scorers||[]).forEach(s=>{
    const nm=(s.name||'').trim();if(!nm||!s.goals)return;
    const k=nm.toLowerCase()+'|'+s.team;
    const o=map[k]||(map[k]={name:nm,team:s.team,goals:0,games:new Set()});
    o.goals+=Number(s.goals);o.games.add(m.id);
  }));
  return Object.values(map).sort((a,b)=>b.goals-a.goals||a.name.localeCompare(b.name));
}

function card(m){
  const ed=canEdit&&editing===m.id;
  const loc=(m.local||'').trim(),fora=mine(m.home)&&loc&&!/^afc$/i.test(loc);
  const sc=played(m)?`<div class="sc">${fora?m.as+' x '+m.hs:m.hs+' x '+m.as}</div>`:`<div class="sc vs">x</div>`;
  const gl=(m.scorers||[]).filter(s=>s.name&&s.goals).map(s=>`${esc(s.name)}${s.goals>1?' ('+s.goals+')':''}`).join(', ');
  const rs=resOf(m);let h=`<div class="card ${rs?'r'+rs:''}" data-id="${m.id}"><div class="dt">${esc(fdate(m.date,m.time))}${m.local?' · 📍 '+esc(m.local):''}${m.canc?' · <b class="warn">Cancelado</b>':''}${rs?` · <b class="b${rs}">${BADGE[rs]}</b>`:''}</div>
  <div class="row"><div class="tm">${tn(fora?m.away:m.home)}</div>${sc}<div class="tm r">${tn(fora?m.home:m.away)}</div></div>`;
  if(gl&&!ed)h+=`<div class="gl">⚽ ${gl}</div>`;
  const pk=(Array.isArray(m.posts)?m.posts:[]).filter(Boolean);
  if(pk.length&&!ed)h+=`<div class="act">${pk.map((f,i)=>`<button class="btn p" data-act="dlpost" data-f="${esc(f)}">⬇ Baixar post do jogo${pk.length>1?' '+(i+1):''}</button>`+(navigator.canShare?`<button class="btn" data-act="sharepost" data-f="${esc(f)}">📤 Compartilhar</button>`:'')).join('')}</div>`;
  if(ed){
    const d=draft;
    const iH=`<input class="sn" id="hs" type="number" min="0" value="${d.hs}" aria-label="Gols ${esc(m.home)}">`,iA=`<input class="sn" id="as" type="number" min="0" value="${d.as}" aria-label="Gols ${esc(m.away)}">`;
    h+=`<div class="ed">${fora?iA:iH}<b>x</b>${fora?iH:iA}</div>
    <div class="dt">Quem fez os gols?</div>`;
    d.scorers.forEach((s,i)=>{
      h+=`<div class="sr"><input class="pn" list="players" placeholder="Jogador" value="${esc(s.name)}">
      <select class="pt"><option ${s.team===m.home?'selected':''}>${esc(m.home)}</option><option ${s.team===m.away?'selected':''}>${esc(m.away)}</option></select>
      <input class="pg" type="number" min="1" value="${s.goals}" aria-label="Gols"><button class="btn d" data-act="rmsc" data-i="${i}" aria-label="Remover">✕</button></div>`;
    });
    h+=`<div class="act"><button class="btn" data-act="addsc">+ Jogador</button></div><div class="hint" id="chk"></div>
    <div class="act"><button class="btn p" data-act="save">Salvar resultado</button><button class="btn" data-act="cancel">Cancelar</button>${played(m)?'<button class="btn d" data-act="clear">Limpar resultado</button>':''}</div>`;
  }else if(canEdit){
    h+=`<div class="act"><button class="btn" data-act="edit">${played(m)?'Editar resultado':'Lançar resultado'}</button><button class="btn" data-act="posts">🖼 Posts${Array.isArray(m.posts)&&m.posts.length?' ('+m.posts.length+')':''}</button><button class="btn d" data-act="del">Excluir</button></div>`;
  }
  return h+'</div>';
}

function viewJogos(){
  let h='';
  if(canEdit){
    h+=`<details class="card"><summary>+ Adicionar jogo à agenda</summary><div class="f" style="margin-top:10px">
    <input id="nd" type="date" aria-label="Data"><input id="nt" type="time" aria-label="Hora">
    <input id="nh" placeholder="Time da casa" value="Americano FC"><input id="na" placeholder="Time visitante"><input id="nl" class="w" placeholder="Local do jogo">
    <button class="btn p w" data-act="add">Adicionar</button></div></details>`;
  }
  h+=`<div class="chips">${[['todos','Todos'],['agenda','Agenda'],['res','Resultados']].map(([k,l])=>`<button class="chip ${flt===k?'on':''}" data-flt="${k}">${l}</button>`).join('')}</div>`;
  const canc=S.matches.filter(m=>m.canc&&!played(m)).sort((a,b)=>key(b).localeCompare(key(a)));
  const next=S.matches.filter(m=>!played(m)&&!m.canc).sort((a,b)=>key(a).localeCompare(key(b)));
  const done=S.matches.filter(played).sort((a,b)=>key(b).localeCompare(key(a)));
  if(flt!=='res'&&next.length)h+=`<div class="sec">Próximos jogos</div>`+next.map(card).join('');
  if(flt!=='agenda'&&done.length)h+=`<div class="sec">Resultados</div>`+done.map(card).join('');
  if(flt==='todos'&&canc.length)h+=`<div class="sec">Cancelados</div>`+canc.map(card).join('');
  if(!S.matches.length||(flt==='agenda'&&!next.length)||(flt==='res'&&!done.length))
    h+=`<div class="em">${canEdit?'Nenhum jogo aqui ainda. Adicione o primeiro acima.':'Nenhum jogo aqui ainda.'}</div>`;
  if(mode==='local')h+=`<div class="hint">Os dados ficam salvos só neste navegador.</div>`;
  return h;
}

function viewArt(){
  const a=scorers();
  if(!a.length)return `<div class="em">Os artilheiros aparecem aqui assim que você lançar os gols de um jogo.</div>`;
  let pos=0,prev=null,h='<div class="card wrap"><table><thead><tr><th class="n">#</th><th>Jogador</th><th>Time</th><th class="n">Jogos</th><th class="n">Gols</th></tr></thead><tbody>';
  a.forEach((p,i)=>{if(p.goals!==prev){pos=i+1;prev=p.goals}
    h+=`<tr><td class="n">${pos}</td><td><b>${esc(p.name)}</b></td><td>${tn(p.team)}</td><td class="n">${p.games.size}</td><td class="g">${p.goals}</td></tr>`});
  return h+'</tbody></table></div><div class="hint">Os gols são somados automaticamente a partir dos resultados lançados.</div>';
}

const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function viewResumo(){
  let h=`<div class="chips">${[['mes','Por mês'],['ano','Por ano']].map(([k,l])=>`<button class="chip ${grp===k?'on':''}" data-grp="${k}">${l}</button>`).join('')}</div>`;
  const teams=[...new Set(S.matches.flatMap(m=>[m.home,m.away]))].sort((a,b)=>a.localeCompare(b));
  if(selTeam&&!teams.includes(selTeam))selTeam='';
  h+=`<div class="chips"><select id="tsel" aria-label="Filtrar por time"><option value="">Todos os times</option>${teams.map(n=>`<option value="${esc(n)}" ${n===selTeam?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`;
  const cs=clubStats(S.matches.filter(played));
  h+=`<div class="card"><div class="dt">${tn('Americano FC')} · total geral</div><div class="kp">${[['Jogos',cs.j,''],['✅ Vitórias',cs.v,'kw'],['🟨 Empates',cs.e,'ke'],['❌ Derrotas',cs.d,'kl'],['GP (Gols Pró)',cs.gf,'gf'],['GC (Gols Contra)',cs.gt,'gt'],['Saldo',(cs.gf-cs.gt>0?'+':'')+(cs.gf-cs.gt),'']].map(([l,v,c])=>`<div class="${c}"><b>${v}</b><span>${l}</span></div>`).join('')}</div></div>`;
  const g={};
  S.matches.filter(played).filter(m=>!selTeam||m.home===selTeam||m.away===selTeam).forEach(m=>{
    const [y,mo]=(m.date||'').split('-');
    const k=!y?'0':(grp==='ano'?y:y+'-'+mo);
    (g[k]=g[k]||[]).push(m);
  });
  const keys=Object.keys(g).sort((a,b)=>a==='0'?1:b==='0'?-1:b.localeCompare(a));
  if(!keys.length)return h+'<div class="em">Lance os resultados dos jogos para ver vitórias, empates e derrotas por período.</div>';
  keys.forEach(k=>{
    const ms=g[k],T={};
    const t=n=>T[n]||(T[n]={n,j:0,v:0,e:0,d:0,gp:0,gc:0});
    ms.forEach(m=>{const a=t(m.home),b=t(m.away);a.j++;b.j++;a.gp+=m.hs;a.gc+=m.as;b.gp+=m.as;b.gc+=m.hs;
      if(m.hs>m.as){a.v++;b.d++}else if(m.hs<m.as){b.v++;a.d++}else{a.e++;b.e++}});
    const rows=Object.values(T).filter(r=>!selTeam||r.n===selTeam).map(r=>({...r,p:r.v*3+r.e})).sort((a,b)=>b.p-a.p||b.v-a.v||(b.gp-b.gc)-(a.gp-a.gc)||a.n.localeCompare(b.n));
    const lb=k==='0'?'Sem data':grp==='ano'?k:MESES[+k.slice(5)-1]+'/'+k.slice(0,4);
    h+=`<div class="sec">${esc(lb)} · ${ms.length} ${ms.length===1?'jogo':'jogos'}</div><div class="card wrap"><table><thead><tr><th>Time</th><th class="n">J</th><th class="n kw">✅ V</th><th class="n ke">🟨 E</th><th class="n kl">❌ D</th><th class="n">GP</th><th class="n">GC</th><th class="n">Pts</th></tr></thead><tbody>`+
      rows.map(r=>`<tr class="${mine(r.n)?'me':''}"><td><b>${tn(r.n)}</b></td><td class="n">${r.j}</td><td class="n kw"><b>${r.v}</b></td><td class="n ke">${r.e}</td><td class="n kl">${r.d}</td><td class="n">${r.gp}</td><td class="n">${r.gc}</td><td class="n"><b>${r.p}</b></td></tr>`).join('')+'</tbody></table></div>'+clubLine(ms);
  });
  return h+'<div class="hint">J = jogos · V = vitórias · E = empates · D = derrotas · GP = gols pró · GC = gols contra · Pts = pontos (vitória 3, empate 1)</div>';
}

function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const act=document.activeElement;
  $('#app').innerHTML=mode==='wait'?'<div class="em">Carregando…</div>':(canEdit?adminBar():'')+(tab==='jogos'?viewJogos():tab==='res'?viewResumo():viewArt());
  $('#players').innerHTML=[...new Set(scorers().map(p=>p.name))].map(n=>`<option value="${esc(n)}">`).join('');
  checkGoals();
}

function readDraft(){
  if(!draft)return;
  draft.hs=$('#hs')?.value??draft.hs;draft.as=$('#as')?.value??draft.as;
  const rows=[...document.querySelectorAll('.sr')];
  if(rows.length)draft.scorers=rows.map(r=>({name:r.querySelector('.pn').value,team:r.querySelector('.pt').value,goals:Number(r.querySelector('.pg').value)||1}));
}
function checkGoals(){
  const el=$('#chk');if(!el||!draft)return;readDraft();
  const m=S.matches.find(x=>x.id===editing);if(!m)return;
  const sum=t=>draft.scorers.filter(s=>s.team===t&&s.name.trim()).reduce((a,s)=>a+s.goals,0);
  const dh=sum(m.home),da=sum(m.away),hs=Number(draft.hs)||0,as=Number(draft.as)||0;
  el.className='hint'+((dh>hs||da>as)?' warn':'');
  el.textContent=`Gols informados: ${m.home} ${dh}/${hs} · ${m.away} ${da}/${as}`+((dh>hs||da>as)?' — mais gols de jogadores do que no placar':'');
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;return render()}
  if(t.dataset.flt){flt=t.dataset.flt;return render()}
  if(t.dataset.grp){grp=t.dataset.grp;return render()}
  const act=t.dataset.act;if(!act)return;
  if(act==='dl')return baixar();
  if(act==='csv')return baixarCsv();
  if(act==='dlpost')return baixarPost(t.dataset.f);
  if(act==='sharepost')return compartilharPost(t.dataset.f);
  if(act==='reset')return descartar();
  const c=t.closest('.card'),id=c&&c.dataset.id,m=S.matches.find(x=>x.id===id);
  if(act==='posts'){
    const cur=(Array.isArray(m.posts)?m.posts:[]).join(', ');
    const v=prompt('Nome(s) do(s) arquivo(s) da pasta "posts", separados por vírgula (ex.: jogo-07-nov.png). Deixe vazio para remover o post deste jogo.',cur);
    if(v===null)return;
    const l=v.split(',').map(x=>x.trim()).filter(Boolean);
    if(l.length)m.posts=l;else delete m.posts;
    return persist();
  }
  if(act==='add'){
    const home=$('#nh').value.trim(),away=$('#na').value.trim();
    if(!home||!away)return alert('Informe os dois times.');
    S.matches.push({id:uid(),date:$('#nd').value,time:$('#nt').value,home,away,local:$('#nl').value.trim(),hs:null,as:null,scorers:[]});
    return persist();
  }
  if(act==='edit'){editing=id;draft={hs:m.hs??0,as:m.as??0,scorers:(m.scorers||[]).map(s=>({...s}))};return render()}
  if(act==='cancel'){editing=null;draft=null;return render()}
  if(act==='addsc'){readDraft();draft.scorers.push({name:'',team:m.home,goals:1});return render()}
  if(act==='rmsc'){readDraft();draft.scorers.splice(+t.dataset.i,1);return render()}
  if(act==='save'){
    readDraft();
    m.canc=false;m.hs=Math.max(0,parseInt(draft.hs)||0);m.as=Math.max(0,parseInt(draft.as)||0);
    m.scorers=draft.scorers.filter(s=>s.name.trim()).map(s=>({name:s.name.trim(),team:s.team,goals:Math.max(1,s.goals)}));
    editing=null;draft=null;return persist();
  }
  if(act==='clear'){m.hs=null;m.as=null;m.scorers=[];editing=null;draft=null;return persist()}
  if(act==='del'){if(confirm('Excluir este jogo?')){S.matches=S.matches.filter(x=>x.id!==id);persist()}}
});

const ADMIN=(()=>{try{if(location.hash==='#admin')localStorage.setItem('afc-admin','1');if(location.hash==='#sair')localStorage.removeItem('afc-admin');return localStorage.getItem('afc-admin')==='1'}catch(e){return location.hash==='#admin'}})();
function adminBar(){return '<div class="hint" style="margin:0 0 10px;padding:8px 10px;border:1px dashed var(--bd);border-radius:8px">🔒 Modo administrador: as alterações ficam só neste aparelho até você publicar o arquivo dados.json no GitHub.<div class="act" style="margin-top:6px"><button class="btn" data-act="dl">⬇ Baixar dados.json</button> <button class="btn" data-act="csv">📊 Baixar planilha (Excel)</button> <button class="btn" data-act="reset">↺ Descartar rascunho</button></div></div>'}
function baixar(){const b=new Blob([JSON.stringify({matches:S.matches},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dados.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function postBlob(f){const r=await fetch('posts/'+encodeURI(f),{cache:'no-cache'});if(!r.ok)throw new Error(r.status);return await r.blob()}
async function baixarPost(f){
  try{const b=await postBlob(f);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  catch(e){alert('Não foi possível baixar a imagem agora. Tente de novo em instantes.')}
}
async function compartilharPost(f){
  try{const b=await postBlob(f);const file=new File([b],f,{type:b.type||'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Americano FC'});
    else baixarPost(f)}
  catch(e){if(e&&e.name==='AbortError')return;baixarPost(f)}
}
function baixarCsv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const dt=d=>d?d.split('-').reverse().join('/'):'';
  const L=[['Data','Hora','Local','Mandante','Gols mandante','Gols visitante','Visitante','Situação','Artilheiros'].map(q).join(';')];
  [...S.matches].sort((a,b)=>((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||''))).forEach(m=>{
    const gl=(m.scorers||[]).filter(x=>x.name&&x.goals).map(x=>x.name+(x.goals>1?' ('+x.goals+')':'')).join(', ');
    const sit=m.canc?'Cancelado':(m.hs!=null&&m.as!=null?'Jogado':'Agendado');
    L.push([dt(m.date),m.time||'',m.local||'',m.home,m.hs==null?'':m.hs,m.as==null?'':m.as,m.away,sit,gl].map(q).join(';'));
  });
  const b=new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='americano-fc-jogos.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)
}
async function carregar(){
  try{const r=await fetch('dados.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();if(!Array.isArray(d.matches))throw 0;return d}catch(e){return SEED}
}
function descartar(){if(!confirm('Descartar as alterações deste aparelho e voltar aos dados publicados?'))return;try{localStorage.removeItem('fut')}catch(e){}init()}
async function init(){
  canEdit=ADMIN;mode='site';
  let d=null;
  if(ADMIN){try{d=JSON.parse(localStorage.getItem('fut')||'null')}catch(e){}}
  S=d&&Array.isArray(d.matches)?d:await carregar();
  try{const r=await fetch('logos/lista.json?v='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();LMAP={};for(const k in j)LMAP[slug(k)]=j[k]}}catch(e){}
  render();
}
render();
init();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!ADMIN&&!editing)init()});
(function(){
  const box=$('#inst'),txt=$('#inst-t'),go=$('#inst-go'),no=$('#inst-no');
  const DEF=txt.textContent;
  if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return;
  try{const t=+localStorage.getItem('inst-off');if(t&&Date.now()-t<7*864e5)return}catch(e){}
  const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),and=/android/i.test(ua);
  let dp=null;
  if(ios||and)box.hidden=false;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;box.hidden=false});
  addEventListener('appinstalled',()=>{box.hidden=true});
  go.onclick=async()=>{
    if(dp){dp.prompt();try{await dp.userChoice}catch(e){}dp=null;box.hidden=true;return}
    txt.textContent=ios?'Toque em Compartilhar (quadrado com seta) no Safari e depois em “Adicionar à Tela de Início”.':'Toque no menu ⋮ do navegador e depois em “Instalar app” ou “Adicionar à tela inicial”.';
  };
  no.onclick=()=>{box.hidden=true;try{localStorage.setItem('inst-off',String(Date.now()))}catch(e){}};
})();
</script>
