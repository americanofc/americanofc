<title>Americano FC</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#14201a;--mu:#5d6b63;--ac:#14804a;--ac2:#e6f4ec;--bd:#dde3de;--dn:#b3261e;--rd:#d92323;--yl:#a16207;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#18211c;--tx:#e8efe9;--mu:#98a79e;--ac:#3fbf7f;--ac2:#1d3226;--bd:#2a3730;--dn:#f2877f;--rd:#a81b1b;--yl:#facc15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#18211c;--tx:#e8efe9;--mu:#98a79e;--ac:#3fbf7f;--ac2:#1d3226;--bd:#2a3730;--dn:#f2877f;--rd:#a81b1b;--yl:#facc15;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
.hd{display:flex;align-items:center;gap:14px;background:var(--rd);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;border-bottom:5px solid var(--ac)}.hd img{height:56px;width:auto}.hd h1{font-size:22px;margin:0;line-height:1.1}.hd p{margin:3px 0 0;font-size:13px;opacity:.92}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-top:8px;text-align:center}.kp b{display:block;font-size:22px}.kp span{font-size:12px;color:var(--mu)}.kp .gf b{color:var(--ac)}.kp .gt b{color:var(--dn)}tr.me td{background:var(--ac2)}.tl{display:inline-block;width:1.7em;height:1.3em;object-fit:contain;vertical-align:-.3em;margin-right:6px}.lg{display:inline-block;width:1.7em;height:1.1em;background:var(--logo) center/contain no-repeat;vertical-align:-.15em;margin-right:6px}.card.rw{border-left:5px solid #16a34a;background-image:linear-gradient(90deg,rgba(22,163,74,.14),transparent 45%)}.card.re{border-left:5px solid #eab308;background-image:linear-gradient(90deg,rgba(234,179,8,.18),transparent 45%)}.card.rl{border-left:5px solid #dc2626;background-image:linear-gradient(90deg,rgba(220,38,38,.14),transparent 45%)}.bw,.kw{color:var(--ac)}.be,.ke{color:var(--yl)}.bl,.kl{color:var(--dn)}.kp>div{padding:8px 4px;border-radius:10px}.kp>div.kw{background:rgba(22,163,74,.14)}.kp>div.ke{background:rgba(234,179,8,.18)}.kp>div.kl{background:rgba(220,38,38,.14)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
button,input,select{font:inherit;color:inherit}
.tab{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);border-radius:10px;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:5px 12px;border:1px solid var(--bd);background:var(--card);border-radius:99px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.dt{font-size:13px;color:var(--mu)}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}
.tm{flex:1;font-weight:600}
.tm.r{text-align:right}
.sc{font-size:22px;font-weight:700;min-width:70px;text-align:center}
.sc.vs{font-size:14px;color:var(--mu);font-weight:500}
.gl{font-size:13px;color:var(--mu);margin-top:8px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:16px 0 8px}
.btn{padding:7px 12px;border:1px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer;font-size:14px}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.lnk{background:none;border:0;color:var(--mu);font-size:13px;text-decoration:underline;cursor:pointer;padding:8px;opacity:.8}
a.btn{text-decoration:none;display:inline-block;color:inherit}
a.btn.p{color:#fff}
.btn.d{color:var(--dn)}
.act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
input,select{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);min-width:0}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f .w{grid-column:1/-1}
details.card summary{cursor:pointer;font-weight:600}
.sr{display:grid;grid-template-columns:1fr 1fr 64px 30px;gap:6px;margin-top:6px}
.sn{width:56px;text-align:center}
.ed{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);text-transform:uppercase}
td.n,th.n{text-align:center}
td.g{font-weight:700;color:var(--ac);text-align:center;font-size:18px}
.em{text-align:center;color:var(--mu);padding:28px 8px}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
.warn{color:var(--dn)}
#inst{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;max-width:696px;margin:0 auto;background:#0f1923;border:1px solid #223140;border-radius:18px;padding:14px 16px 16px;box-shadow:0 10px 32px rgba(0,0,0,.45);color:#f1f5f9;animation:instUp .35s ease-out}
@keyframes instUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#inst[hidden]{display:none}
#inst .ih{display:flex;align-items:center;gap:14px}
#inst .ic{flex:none;width:66px;height:46px;display:flex;align-items:center;justify-content:center}
#inst .ic img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
#inst .it{flex:1;min-width:0}
#inst .it b{display:block;font-size:16px;color:#f1f5f9}
#inst .it p{margin:2px 0 0;font-size:14px;line-height:1.35;color:#94a3b8}
#inst .ix{flex:none;align-self:flex-start;background:none;border:0;padding:4px;cursor:pointer;color:#94a3b8;line-height:0}
#inst .ig{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px;border-radius:12px;border:1px solid rgba(34,197,94,.45);background:rgba(34,197,94,.12);color:#22c55e;font-weight:700;font-size:16px;cursor:pointer}
#inst .ig:active{background:rgba(34,197,94,.22)}
#splash{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#f04545 0%,#d92323 48%,#a51111 100%);overflow:hidden;cursor:pointer;transition:opacity .55s ease,transform .55s ease}
#splash.out{opacity:0;transform:scale(1.07);pointer-events:none}
#splash::before{content:"";position:absolute;inset:-60%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 90px,rgba(255,255,255,0) 90px 180px);animation:spStripes 9s linear infinite}
@keyframes spStripes{to{transform:translateX(180px)}}
#splash .sp-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;max-width:94vw}
#splash .sp-lw{position:relative;width:min(64vw,310px)}
#splash .sp-glow{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;margin:0;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 62%);opacity:0}
#splash.go .sp-glow{animation:spGlow 2.2s ease-in-out .3s infinite}
@keyframes spGlow{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.9)}50%{opacity:.8;transform:translate(-50%,-50%) scale(1.08)}}
#splash .sp-ring{position:absolute;left:0;right:0;top:50%;aspect-ratio:1;margin-top:-50%;border-radius:50%;border:3px solid rgba(255,255,255,.6);opacity:0}
#splash.go .sp-ring{animation:spRing 2.6s ease-out infinite}
#splash .sp-ring:nth-of-type(2){animation-delay:.87s}
#splash .sp-ring:nth-of-type(3){animation-delay:1.74s}
@keyframes spRing{0%{transform:scale(.55);opacity:.8}100%{transform:scale(3.1);opacity:0}}
#splash .sp-logo{position:relative;display:block;width:100%;height:auto;opacity:0;transform:scale(.3) rotate(-14deg);filter:drop-shadow(0 14px 26px rgba(0,0,0,.38))}
#splash.go .sp-logo{animation:spPop .95s cubic-bezier(.2,1.4,.4,1) .1s forwards,spFloat 2.8s ease-in-out 1.05s infinite}
@keyframes spPop{0%{opacity:0;transform:scale(.3) rotate(-14deg)}55%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes spFloat{0%,100%{opacity:1;transform:translateY(0) rotate(0) scale(1)}25%{opacity:1;transform:translateY(-9px) rotate(-2.2deg) scale(1.025)}75%{opacity:1;transform:translateY(-9px) rotate(2.2deg) scale(1.025)}}
#splash .sp-t{position:relative;margin:30px 0 0;color:#fff;font-family:"Arial Black","Segoe UI Black","Helvetica Neue",Arial,sans-serif;font-weight:900;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.22),0 8px 22px rgba(0,0,0,.28)}
#splash .sp-t1{font-size:clamp(36px,10vw,58px);letter-spacing:.3px}
#splash .sp-t2{font-size:clamp(21px,5.8vw,32px);margin-top:10px;font-weight:800}
#splash .sp-w{display:inline-block;opacity:0;transform:translateY(26px) scale(.88)}
#splash.go .sp-w{animation:spWord .55s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:calc(1.0s + var(--i) * .17s)}
@keyframes spWord{to{opacity:1;transform:none}}
#splash .sp-y{position:relative}
#splash .sp-y::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:7px;border-radius:4px;background:#22d36b;transform:scaleX(0);transform-origin:left}
#splash.go .sp-y::after{animation:spBar .5s ease 1.7s forwards}
@keyframes spBar{to{transform:scaleX(1)}}
#splash .sp-bar{position:absolute;left:0;bottom:0;height:10px;width:0;background:#22d36b}
#splash.go .sp-bar{animation:spBarW 1.3s ease .3s forwards}
@keyframes spBarW{to{width:100%}}
#splash .sp-hint{position:absolute;left:0;right:0;bottom:28px;text-align:center;color:rgba(255,255,255,.75);font:600 13px "Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.4px;opacity:0}
#splash.go .sp-hint{animation:spFade .6s ease 2s forwards}
@keyframes spFade{to{opacity:1}}
#splash .sp-dot{position:absolute;bottom:-20px;border-radius:50%;opacity:0;animation:spUp linear infinite}
@keyframes spUp{0%{transform:translateY(0);opacity:0}12%{opacity:.8}100%{transform:translateY(-115vh);opacity:0}}
@media (prefers-reduced-motion:reduce){#splash::before,#splash .sp-ring,#splash .sp-dot{animation:none!important}#splash.go .sp-logo{animation:spPop .4s ease .05s forwards}}

function scorers(){
  const map={};
  S.matches.filter(played).forEach(m=>(m.scorers||[]).forEach(s=>{
    const nm=(s.name||'').trim();if(!nm||!s.goals)return;
    const k=nm.toLowerCase()+'|'+s.team;
    const o=map[k]||(map[k]={name:nm,team:s.team,goals:0,games:new Set()});
    o.goals+=Number(s.goals);o.games.add(m.id);
  }));
  return Object.values(map).sort((a,b)=>b.goals-a.goals||a.name.localeCompare(b.name));
}

      if(m.hs>m.as){a.v++;b.d++}else if(m.hs<m.as){b.v++;a.d++}else{a.e++;b.e++}});
    const rows=Object.values(T).filter(r=>!selTeam||r.n===selTeam).map(r=>({...r,p:r.v*3+r.e})).sort((a,b)=>b.p-a.p||b.v-a.v||(b.gp-b.gc)-(a.gp-a.gc)||a.n.localeCompare(b.n));
    const lb=k==='0'?'Sem data':grp==='ano'?k:MESES[+k.slice(5)-1]+'/'+k.slice(0,4);
    h+=`<div class="sec">${esc(lb)} · ${ms.length} ${ms.length===1?'jogo':'jogos'}</div><div class="card wrap"><table><thead><tr><th>Time</th><th class="n">J</th><th class="n kw">✅ V</th><th class="n ke">🟨 E</th><th class="n kl">❌ D</th><th class="n">GP</th><th class="n">GC</th><th class="n">Pts</th></tr></thead><tbody>`+
      rows.map(r=>`<tr class="${mine(r.n)?'me':''}"><td><b>${tn(r.n)}</b></td><td class="n">${r.j}</td><td class="n kw"><b>${r.v}</b></td><td class="n ke">${r.e}</td><td class="n kl">${r.d}</td><td class="n">${r.gp}</td><td class="n">${r.gc}</td><td class="n"><b>${r.p}</b></td></tr>`).join('')+'</tbody></table></div>'+clubLine(ms);
  });
  return h+'<div class="hint">J = jogos · V = vitórias · E = empates · D = derrotas · GP = gols pró · GC = gols contra · Pts = pontos (vitória 3, empate 1)</div>';
}

function readDraft(){
  if(!draft)return;
  draft.hs=$('#hs')?.value??draft.hs;draft.as=$('#as')?.value??draft.as;
  const rows=[...document.querySelectorAll('.sr')];
  if(rows.length)draft.scorers=rows.map(r=>({name:r.querySelector('.pn').value,team:r.querySelector('.pt').value,goals:Number(r.querySelector('.pg').value)||1}));
}
function checkGoals(){
  const el=$('#chk');if(!el||!draft)return;readDraft();
  const m=S.matches.find(x=>x.id===editing);if(!m)return;
  const sum=t=>draft.scorers.filter(s=>s.team===t&&s.name.trim()).reduce((a,s)=>a+s.goals,0);
  const dh=sum(m.home),da=sum(m.away),hs=Number(draft.hs)||0,as=Number(draft.as)||0;
  el.className='hint'+((dh>hs||da>as)?' warn':'');
  el.textContent=`Gols informados: ${m.home} ${dh}/${hs} · ${m.away} ${da}/${as}`+((dh>hs||da>as)?' — mais gols de jogadores do que no placar':'');

  if(act==='dlpost')return baixarPost(t.dataset.f);

  if(act==='reset')return descartar();
  const c=t.closest('.card'),id=c&&c.dataset.id,m=S.matches.find(x=>x.id===id);
  if(act==='posts'){
    const cur=(Array.isArray(m.posts)?m.posts:[]).join(', ');

    if(v===null)return;

    return persist();
  }
  if(act==='add'){
    const home=$('#nh').value.trim(),away=$('#na').value.trim();
    if(!home||!away)return alert('Informe os dois times.');
    S.matches.push({id:uid(),date:$('#nd').value,time:$('#nt').value,home,away,local:$('#nl').value.trim(),hs:null,as:null,scorers:[]});
    return persist();
  }
  if(act==='edit'){editing=id;draft={hs:m.hs??0,as:m.as??0,scorers:(m.scorers||[]).map(s=>({...s}))};return render()}
  if(act==='cancel'){editing=null;draft=null;return render()}
  if(act==='addsc'){readDraft();draft.scorers.push({name:'',team:m.home,goals:1});return render()}
  if(act==='rmsc'){readDraft();draft.scorers.splice(+t.dataset.i,1);return render()}
  if(act==='save'){
    readDraft();
    m.canc=false;m.hs=Math.max(0,parseInt(draft.hs)||0);m.as=Math.max(0,parseInt(draft.as)||0);
    m.scorers=draft.scorers.filter(s=>s.name.trim()).map(s=>({name:s.name.trim(),team:s.team,goals:Math.max(1,s.goals)}));
    editing=null;draft=null;return persist();
  }
  if(act==='clear'){m.hs=null;m.as=null;m.scorers=[];editing=null;draft=null;return persist()}
  if(act==='del'){if(confirm('Excluir este jogo?')){S.matches=S.matches.filter(x=>x.id!==id);persist()}}
});

  [...S.matches].sort((a,b)=>((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||''))).forEach(m=>{

async function imgOk(blob){const u=URL.createObjectURL(blob);try{const im=new Image();im.src=u;await im.decode();return im.naturalWidth+'x'+im.naturalHeight}catch(e){return null}finally{URL.revokeObjectURL(u)}}
async function chk(url){try{return await fetch(url+(url.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'})}catch(e){return null}}
async function achaLogo(n){
  const s=slug(n),c=[],v=LMAP[s];
  if(v){if(HASEXT.test(v))c.push(v);else EXT.forEach(e=>c.push(v+'.'+e))}
  EXT.forEach(e=>c.push(s+'.'+e));
  for(const f of c){const x=await chk('logos/'+encodeURI(f));if(x&&x.ok){const b=await x.blob();return {f,dim:await imgOk(b),kb:Math.round(b.size/1024)}}}
  return null;
}
async function rodarTestes(){
  if(TESTING)return;TESTING=true;TESTS=[];render();
  const add=(st,m)=>TESTS.push({s:st,m});
  try{
    const r=await chk('dados.json');
    if(!r)add('err','dados.json: sem resposta do servidor');
    else if(!r.ok)add('err','dados.json: erro HTTP '+r.status+' (arquivo não encontrado na raiz do site)');
    else{try{const d=await r.json();Array.isArray(d.matches)?add('ok','dados.json: '+d.matches.length+' jogos publicados'):add('err','dados.json: formato inválido')}catch(e){add('err','dados.json: JSON inválido ('+e.message+')')}}
    for(const f of ['manifest.json','icon-192.png','icon-512.png','icon-180.png']){const x=await chk(f);add(x&&x.ok?'ok':'warn',f+': '+(x?(x.ok?'ok':'HTTP '+x.status):'sem resposta')+(x&&x.ok?'':(f==='icon-180.png'?' (ícone usado no iPhone)':' (necessário para instalar o app)')))}
    const wk=await chk('push/onesignal/OneSignalSDKWorker.js');add(wk&&wk.ok?'ok':'err','Arquivo de avisos (push/onesignal/OneSignalSDKWorker.js): '+(wk?(wk.ok?'ok':'HTTP '+wk.status+' — envie a pasta push para o GitHub'):'sem resposta'));
    const lr=await chk('logos/lista.json');
    add(lr&&lr.ok?'ok':'warn','logos/lista.json: '+(lr?(lr.ok?'ok':'não encontrada (opcional)'):'sem resposta'));
    const times=[...new Set(S.matches.flatMap(m=>[m.home,m.away]).filter(n=>n&&!mine(n)))].sort();
    const out=[];
    for(let i=0;i<times.length;i+=5){const part=times.slice(i,i+5);out.push(...await Promise.all(part.map(async n=>[n,await achaLogo(n)])))}
    let nOk=0;
    out.forEach(([n,x])=>{if(!x)add('warn','Logo de '+n+': não encontrado (esperado logos/'+slug(n)+'.png)');else if(!x.dim)add('err','Logo de '+n+': o arquivo '+x.f+' existe mas NÃO abre como imagem (corrompido ou formato inválido)');else nOk++});
    add(nOk===times.length?'ok':'warn','Logos de adversários encontrados: '+nOk+' de '+times.length);
    const cp=S.matches.filter(m=>Array.isArray(m.posts)&&m.posts.length);
    if(!cp.length)add('warn','Nenhum jogo tem post liberado ainda');
    for(const m of cp)for(const f of m.posts){
      const lab=(m.away||'')+' · '+(m.date||'');
      const dup=/\.(png|jpe?g|webp)\.(png|jpe?g|webp)$/i.test(f);
      const sp=f!==f.trim();
      const hint=(dup?' · extensão duplicada no nome':'')+(sp?' · espaço sobrando no nome':'');
      const x=await chk('posts/'+encodeURI(f));
      if(!x)add('err','Post "'+f+'" ('+lab+'): sem resposta do servidor');
      else if(!x.ok)add('err','Post "'+f+'" ('+lab+'): HTTP '+x.status+' — não encontrado em posts/'+hint);
      else{const b=await x.blob();const dim=await imgOk(b);dim?add('ok','Post "'+f+'" ('+lab+'): ok, '+dim+', '+Math.round(b.size/1024)+' KB'+hint):add('err','Post "'+f+'" ('+lab+'): o arquivo existe mas NÃO abre como imagem (corrompido ou formato inválido)'+hint)}
    }
  }catch(e){add('err','Erro ao rodar os testes: '+e.message);lg('ERRO','Falha nos testes',e.message)}
  TEST_AT=new Date().toISOString();TESTING=false;
  const ne=TESTS.filter(t=>t.s==='err').length,nw=TESTS.filter(t=>t.s==='warn').length;
  lg(ne?'ERRO':nw?'AVISO':'OK','Testes concluídos',ne+' erro(s), '+nw+' aviso(s)');
  render();
}
function relatorio(){
  const L=['RELATÓRIO DE DIAGNÓSTICO - Americano FC','Gerado em: '+fmtT(new Date().toISOString()),'','== AMBIENTE =='];
  envInfo().forEach(([k,v])=>L.push(k+': '+v));
  L.push('','== TESTES '+(TEST_AT?'('+fmtT(TEST_AT)+')':'(não executados)')+' ==');
  TESTS.forEach(t=>L.push({ok:'[OK]  ',warn:'[AVISO] ',err:'[ERRO] '}[t.s]+t.m));
  L.push('','== REGISTRO (mais antigo primeiro) ==');
  LOG.slice(-120).forEach(e=>L.push(fmtT(e.t)+' ['+e.k+'] '+e.m+(e.x?' | '+e.x:'')));
  return L.join('\n');
}

function clearL(x){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';x.clearRect(0,0,W,H)}

function transAt(t){for(var i=1;i<S0.length;i++)if(t>=S0[i]&&t<S0[i]+TR)return {i:i,u:(t-S0[i])/TR};return null}

function composite(c,i,u){
  var m=Math.sin(Math.PI*u);
  if(i===1){

    drawScaled(c,layerB,1.35-.35*eOut(clamp((u-.5)*2)),clamp((u-.42)/.16));

    c.restore();

    speedLines(c,m);flash(c,Math.pow(m,2)*.7,'#bfffd8');
  }else{
    drawScaled(c,layerA,1+.15*eOut(u),1-clamp((u-.35)/.3));
    drawScaled(c,layerB,1.08-.08*eOut(u),clamp((u-.5)/.4));
    ring(c,W/2,H/2,S0[4]+.05,S0[4]+u*TR,1500,'#ffffff',50);
    flash(c,Math.pow(m,1.5)*1.0,'#ffffff');
  }
}
function render(c,t){
  if(!D)D=getData();
  t=clamp(t,0,DUR);
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.shadowBlur=0;
  drawBg(c,t);

  var tr=transAt(t);
  if(!tr){var i=sceneAt(t);SCENES[i](c,t-S0[i],t)}
  else{
    layers();clearL(la);clearL(lb);
    SCENES[tr.i-1](la,t-S0[tr.i-1],t);SCENES[tr.i](lb,t-S0[tr.i],t);
    composite(c,tr.i,tr.u);
  }
  c.restore();
  drawBallLayer(c,t);
}

/* ---------- som (Web Audio) ---------- */
function schedule(ctx,out,t0){
  var nb=(function(){var n=ctx.sampleRate*2,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;return b})();
  var M=ctx.createGain(),K=ctx.createDynamicsCompressor(),LM=ctx.createDynamicsCompressor();
  M.gain.value=.8;K.threshold.value=-16;K.knee.value=12;K.ratio.value=5;K.attack.value=.004;K.release.value=.18;
  LM.threshold.value=-3;LM.knee.value=0;LM.ratio.value=20;LM.attack.value=.001;LM.release.value=.08;
  M.connect(K);K.connect(LM);LM.connect(out);
  M.gain.setValueAtTime(.8,t0+14.55);M.gain.linearRampToValueAtTime(0,t0+14.98);
  function env(g,t,a,pk,d){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
  function osc(type,f,t,d,dest){var o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+d);if(dest)o.connect(dest);return o}
  function noise(t,d,dest){var s=ctx.createBufferSource();s.buffer=nb;s.loop=true;s.start(t,Math.random()*1.5);s.stop(t+d);if(dest)s.connect(dest);return s}
  function filt(type,f,q,dest){var b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;if(q!=null)b.Q.value=q;if(dest)b.connect(dest);return b}
  function kick(t,v){
    var g=ctx.createGain();env(g,t,.002,v,.32);var o=osc('sine',160,t,.4,g);o.frequency.exponentialRampToValueAtTime(42,t+.14);g.connect(M);
    var c2=ctx.createGain();env(c2,t,.001,v*.3,.02);noise(t,.05,c2);c2.connect(M);
  }
  function clap(t,v){
    for(var j=0;j<3;j++){var tt=t+j*.011,g=ctx.createGain();env(g,tt,.001,v*(j===2?1:.6),j===2?.16:.02);var bp=filt('bandpass',1500,1.1,g);noise(tt,.2,bp);g.connect(M)}
  }
  function hat(t,v,open){var g=ctx.createGain();env(g,t,.001,v,open?.14:.045);var hp=filt('highpass',7500,.7,g);noise(t,.2,hp);g.connect(M)}
  function bass(t,f,d,v){
    var g=ctx.createGain();env(g,t,.01,v,d);var lp=filt('lowpass',420,1,g);osc('sawtooth',f,t,d+.1,lp);osc('sine',f,t,d+.1,g);g.connect(M);
  }
  function stab(t,notes,d,v){
    var g=ctx.createGain();env(g,t,.006,v,d);var lp=filt('lowpass',2300,1,g);
    notes.forEach(function(f){var o=osc('sawtooth',f,t,d+.1,lp);o.detune.value=-7;var o2=osc('sawtooth',f,t,d+.1,lp);o2.detune.value=7});
    g.connect(M);
  }
  function whoosh(ta,tb,v){
    var g=ctx.createGain();g.gain.setValueAtTime(.0001,ta);g.gain.exponentialRampToValueAtTime(v,tb);g.gain.linearRampToValueAtTime(.0001,tb+.12);
    var bp=filt('bandpass',250,1.2,g);bp.frequency.setValueAtTime(250,ta);bp.frequency.exponentialRampToValueAtTime(5500,tb);noise(ta,tb-ta+.2,bp);g.connect(M);
  }
  function impact(t,v){
    var g=ctx.createGain();env(g,t,.003,v,.9);var o=osc('sine',85,t,1,g);o.frequency.exponentialRampToValueAtTime(30,t+.8);g.connect(M);
    var n=ctx.createGain();env(n,t,.003,v*.7,.5);var lp=filt('lowpass',500,1,n);noise(t,.6,lp);n.connect(M);
  }
  function whistle(t,d,v){
    var g=ctx.createGain(),bp=filt('bandpass',3100,3,g);
    var o=osc('sine',3050,t,d,bp),o2=osc('sine',3290,t,d,bp),lfo=osc('sine',34,t,d);
    var l1=ctx.createGain();l1.gain.value=260;lfo.connect(l1);l1.connect(o.frequency);
    var l2=ctx.createGain();l2.gain.value=260;lfo.connect(l2);l2.connect(o2.frequency);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.setValueAtTime(v,Math.max(t+.03,t+d-.04));g.gain.linearRampToValueAtTime(.0001,t+d);g.connect(M);
  }
  function pop(t,v){var g=ctx.createGain();env(g,t,.002,v,.1);var o=osc('triangle',760,t,.14,g);o.frequency.exponentialRampToValueAtTime(320,t+.1);g.connect(M)}
  function tick(t,f){var g=ctx.createGain();env(g,t,.001,.1,.05);osc('triangle',f,t,.08,g);g.connect(M)}
  function crowd(){
    var g=ctx.createGain(),lp=filt('lowpass',3200,.7,g),bp=filt('bandpass',850,.4,lp);noise(t0,15,bp);
    var P=[[0,.0],[.3,.07],[.9,.10],[1.0,.30],[1.8,.12],[2.9,.12],[3.0,.24],[3.8,.12],[5.9,.12],[6.0,.24],[6.8,.12],[8.9,.12],[9.0,.24],[9.8,.13],[12.4,.14],[12.5,.55],[13.6,.22],[14.6,.12],[15,0]];
    g.gain.setValueAtTime(P[0][1],t0+P[0][0]);for(var i=1;i<P.length;i++)g.gain.linearRampToValueAtTime(P[i][1],t0+P[i][0]);
    g.connect(M);
  }
  crowd();
  /* abertura */
  whistle(t0+.0,.3,.2);whoosh(t0+.12,t0+1.0,.45);impact(t0+1.0,.85);
  /* música: 120 BPM, começa em 0,5s */
  var roots=[82.41,65.41,98,73.42],chords=[[164.81,196,246.94],[130.81,164.81,196],[196,246.94,293.66],[146.83,185,220]];
  for(var b=0;b<28;b++){
    var t=t0+.5+b*.5,bar=Math.floor(b/4),bb=b%4;
    kick(t,b===0?.7:.9);
    if(b%2===1)clap(t,.55);
    hat(t+.25,.14,b%2===1);if(b>=2)hat(t,.07,false);
    bass(t,roots[bar%4]*(bb===2?2:1),.3,.3);
    if(b>=4){if(bb===0)stab(t,chords[bar%4],.4,.1);if(bb===2)stab(t+.25,chords[bar%4],.2,.08)}
  }
  /* palavras */
  var P1=TL.s1.slice(0,3).concat(TL.s1.slice(4));
  P1.forEach(function(x){pop(t0+x,.18)});
  TL.head.forEach(function(x,i){pop(t0+x,.24);TL.sub[i].forEach(function(y){pop(t0+y,.13)})});
  /* transições: subida de ar + impacto no tempo certo */
  [3.0,6.0,9.0].forEach(function(x){whoosh(t0+x-.4,t0+x,.55);impact(t0+x,.7)});
  /* resultados: contagem e selo */
  for(var k=0;k<7;k++)tick(t0+6.75+k*.11,600+k*70);
  impact(t0+7.5,.5);
  /* final */
  whoosh(t0+12.1,t0+12.5,.7);impact(t0+12.5,1);
  whistle(t0+12.5,.16,.22);whistle(t0+12.75,.16,.22);whistle(t0+13.0,.55,.24);
  [12.75,13.0,13.15,13.3,13.45].forEach(function(x){pop(t0+x,.22)});
  tick(t0+13.5,1100);
}

var ui=null,cv=null,cx=null,playing=false,actx=null,recorder=null,chunks=[],raf=0,mode='';
function css(){
  if(document.getElementById('afcv-css'))return;
  var s=document.createElement('style');s.id='afcv-css';
  s.textContent='#afcv{position:fixed;inset:0;z-index:1000;background:rgba(3,8,6,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;font-family:'+UI+'}'
   +'#afcv[hidden]{display:none}#afcv canvas{height:min(76vh,calc((100vw - 24px)*16/9));aspect-ratio:9/16;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#000}'
   +'#afcv .bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}#afcv button{padding:11px 16px;border-radius:12px;border:1px solid #2b4237;background:#14201a;color:#e8f1ec;font-size:15px;font-weight:600;cursor:pointer}'

   +'<div class="bar"><button class="p" id="afcv-play">▶ Assistir (com som)</button><button id="afcv-rec">⬇ Baixar MP4</button><button id="afcv-close">✕ Fechar</button></div>';
  document.body.appendChild(ui);
  cv=ui.querySelector('canvas');cx=cv.getContext('2d');
  ui.querySelector('#afcv-play').onclick=function(){start(false)};

function say(m){var e=document.getElementById('afcv-st');if(e)e.textContent=m||''}

function bar(t){var i=ui&&ui.querySelector('.pg i');if(i)i.style.width=(clamp(t/DUR)*100)+'%'}

  playing=false;cancelAnimationFrame(raf);
  try{if(recorder){recorder.onstop=null;if(recorder.state!=='inactive')recorder.stop()}}catch(e){}
  try{if(actx)actx.close()}catch(e){}
  actx=null;
}
function close(){stopAll();recorder=null;if(ui)ui.hidden=true;try{lg&&lg('INFO','Vídeo fechado')}catch(e){}}
function pickMime(){
  var c=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(var i=0;i<c.length;i++){try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(c[i]))return c[i]}catch(e){}}

}
async function start(rec){
  if(playing)return;
  try{await logoImg.decode()}catch(e){}
  D=getData();
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){say('Este navegador não toca o som do vídeo. Use o Google Chrome.');return}
  if(rec&&!window.MediaRecorder){say('Para baixar o MP4, abra o app no Google Chrome do computador.');return}
  actx=new AC();try{await actx.resume()}catch(e){}
  var out=actx.createGain();out.connect(actx.destination);
  var mime='',dest=null,stream=null;
  if(rec){
    mime=pickMime();dest=actx.createMediaStreamDestination();out.connect(dest);
    stream=cv.captureStream(30);dest.stream.getAudioTracks().forEach(function(tr){stream.addTrack(tr)});
    chunks=[];
    try{recorder=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:12000000,audioBitsPerSecond:192000}:{videoBitsPerSecond:12000000})}
    catch(e){try{recorder=new MediaRecorder(stream)}catch(e2){say('Não foi possível gravar neste navegador. Use o Google Chrome do computador.');try{actx.close()}catch(e3){}actx=null;return}}
    mime=recorder.mimeType||mime||'video/webm';
    recorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    recorder.onstop=function(){
      if(!chunks.length)return;
      var ext=/mp4/.test(mime)?'mp4':'webm',blob=new Blob(chunks,{type:mime}),a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download='AFC-video.'+ext;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
      say(ext==='mp4'?'Pronto! O vídeo AFC-video.mp4 foi baixado.':'Pronto! O vídeo foi baixado como WEBM (seu navegador não grava MP4). Use o Chrome atualizado para MP4.');
      try{lg&&lg('OK','Vídeo baixado',ext)}catch(e){}
    };
  }
  var t0=actx.currentTime+.3;
  schedule(actx,out,t0);
  setBusy(true);playing=true;mode=rec?'rec':'play';
  say(rec?'Gravando… não feche esta aba até terminar (15 segundos).':'');
  if(rec)recorder.start(250);
  var local=actx,nf=0;
  (function loop(){
    if(!playing||actx!==local)return;
    var t=actx.currentTime-t0;
    render(cx,Math.max(0,t));bar(t);nf++;
    if(t>=DUR+.25){
      playing=false;setBusy(false);bar(DUR);
      if(rec){var fps=nf/DUR;say(fps<24?'Finalizando… Atenção: o computador gerou só '+Math.round(fps)+' quadros por segundo, e o vídeo pode ficar travado. Feche outras abas e tente de novo.':'Finalizando o arquivo…');try{recorder.stop()}catch(e){}}
      try{actx.close()}catch(e){}actx=null;
      if(!rec)say('');
      return;
    }
    raf=requestAnimationFrame(loop);
  })();
}

  try{lg&&lg('INFO','Vídeo aberto')}catch(e){}

};

      appId:APP_ID,
      serviceWorkerPath:base.slice(1)+'push/onesignal/OneSignalSDKWorker.js',
      serviceWorkerParam:{scope:base+'push/onesignal/'},
      notifyButton:{enable:false}
    }).then(function(){pinit=true;pstate='pronto';try{lg('OK','Serviço de avisos iniciado')}catch(e){}},
            function(e){perr=(e&&e.message)||String(e);pstate='erro ao iniciar: '+perr;try{lg('ERRO','Serviço de avisos não iniciou',perr)}catch(x){}});
  });
  setTimeout(function(){
    if(!pinit&&!perr&&typeof window.OneSignal==='undefined'){pstate='o script do OneSignal não carregou (bloqueador de anúncios, rede ou navegador?)';try{lg('ERRO',pstate)}catch(e){}}
  },7000);

  var ua=navigator.userAgent;
  var ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  function supported(){return 'Notification' in window&&'serviceWorker' in navigator&&'PushManager' in window}
  function perm(){return 'Notification' in window?Notification.permission:'unsupported'}
  function log(k,m,x){try{lg(k,m,x)}catch(e){}}

  var st=document.createElement('style');
  st.textContent='#afcv-push{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:19;max-width:696px;margin:0 auto;background:#0f1923;border:1px solid #223140;border-radius:18px;padding:14px 16px 16px;box-shadow:0 10px 32px rgba(0,0,0,.45);color:#f1f5f9;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;animation:afcvDown .35s ease-out}'
   +'@keyframes afcvDown{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}'
   +'#afcv-push .ph{display:flex;align-items:center;gap:14px}#afcv-push .ic{flex:none;width:46px;height:46px;border-radius:12px;background:#22c55e;display:flex;align-items:center;justify-content:center}'
   +'#afcv-push .pt{flex:1;min-width:0}#afcv-push b{display:block;font-size:16px;color:#f1f5f9}#afcv-push p{margin:2px 0 0;font-size:14px;line-height:1.35;color:#94a3b8}#afcv-push p.n{margin-top:6px;color:#fbbf24;font-size:13px}'
   +'#afcv-push .px{flex:none;align-self:flex-start;background:none;border:0;padding:4px;cursor:pointer;color:#94a3b8;line-height:0}'
   +'#afcv-push .pg2{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px;border-radius:12px;border:1px solid rgba(34,197,94,.45);background:rgba(34,197,94,.12);color:#22c55e;font-weight:700;font-size:16px;cursor:pointer}'
   +'#afcv-push .pg2:active{background:rgba(34,197,94,.22)}'
   +'#afc-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#0f1923;color:#f1f5f9;border:1px solid #223140;padding:12px 16px;border-radius:12px;font:600 14px "Segoe UI",Roboto,Arial,sans-serif;max-width:90vw;text-align:center;box-shadow:0 10px 32px rgba(0,0,0,.45)}';
  document.head.appendChild(st);

  var toastT=0;
  function toast(msg){
    var t=document.getElementById('afc-toast');
    if(!t){t=document.createElement('div');t.id='afc-toast';document.body.appendChild(t)}
    t.textContent=msg;t.style.display='block';clearTimeout(toastT);
    toastT=setTimeout(function(){t.style.display='none'},6000);
  }
  function setOff(){try{localStorage.setItem('afc-push-off','1')}catch(e){}}
  function removeCard(){var c=document.getElementById('afcv-push');if(c&&c.parentNode)c.parentNode.removeChild(c)}
  function iosHelp(){
    alert('Para receber avisos no iPhone:\n\n1) Abra este app no Safari.\n2) Toque em Compartilhar (quadrado com seta).\n3) Toque em "Adicionar à Tela de Início".\n4) Abra o app pelo ícone novo e toque em "Ativar avisos".');
    log('INFO','Ajuda de avisos no iPhone aberta');
  }

  window.afcPush=function(){
    var p=perm();
    if(ios&&!standalone){iosHelp();return}
    if(!supported()){toast('Este navegador não permite avisos. Use o Google Chrome.');log('AVISO','Avisos não suportados neste navegador');return}
    if(p==='granted'){toast('Os avisos já estão ativados neste aparelho. ✅');setOff();removeCard();return}
    if(p==='denied'){toast('Os avisos estão bloqueados. Libere nas configurações do site (cadeado ao lado do endereço) e tente de novo.');log('AVISO','Avisos bloqueados pelo usuário');return}
    var waited=0;
    (function tick(){
      if(pinit){ask();return}
      if(perr){toast('Não foi possível iniciar os avisos: '+perr);log('ERRO','Avisos: falha ao iniciar',perr);return}
      if(waited>=12000){
        var nl=pstate.indexOf('não carregou')>=0||typeof window.OneSignal==='undefined';
        toast(nl?'O serviço de avisos não carregou. Desative o bloqueador de anúncios para este site, saia da aba anônima ou tente em outro navegador.':'O serviço de avisos demorou para responder. Tente de novo em instantes.');
        log('ERRO','Avisos: serviço não respondeu',pstate);return;
      }
      waited+=300;setTimeout(tick,300);
    })();
    function ask(){
      OneSignalDeferred.push(function(OS){
        return OS.Notifications.requestPermission().then(function(){
          if(Notification.permission==='granted'){
            try{OS.User.PushSubscription.optIn()}catch(e){}
            setOff();removeCard();toast('Avisos ativados! Você vai receber as novidades do AFC. ✅');log('OK','Avisos ativados');
          }else if(Notification.permission==='denied'){
            toast('Os avisos foram bloqueados. Para ativar, libere as notificações nas configurações do site (cadeado ao lado do endereço).');log('INFO','Permissão de avisos negada');
          }else{
            toast('Tudo bem! Você pode ativar quando quiser pelo botão 🔔 no fim da página.');log('INFO','Permissão de avisos não concedida');
          }
        },function(e){toast('Não foi possível ativar os avisos agora.');log('ERRO','Falha ao pedir permissão de avisos',(e&&e.message)||e)});
      });
    }
  };

  window.afcPushCard=function(){
    try{if(localStorage.getItem('afc-push-off'))return}catch(e){}
    var p=perm();
    if(p==='granted'||p==='denied')return;
    var needIos=ios&&!standalone;
    if(!needIos&&!supported())return;
    if(document.getElementById('afcv-push'))return;
    var box=document.createElement('div');box.id='afcv-push';box.setAttribute('role','dialog');box.setAttribute('aria-label','Ativar avisos');
    box.innerHTML='<div class="ph"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#04170d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>'
      +'<div class="pt"><b>Ative os avisos do AFC</b><p>Receba aviso de jogo, resultado e novidades do time direto no celular.</p>'+(needIos?'<p class="n">No iPhone, primeiro instale o app na tela inicial.</p>':'')+'</div>'
      +'<button class="px" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>'
      +'<button class="pg2">'+(needIos?'Como ativar no iPhone':'🔔 Ativar avisos')+'</button>';
    box.querySelector('.px').onclick=function(){setOff();removeCard()};
    box.querySelector('.pg2').onclick=function(){if(needIos){iosHelp()}else{afcPush()}};
    document.body.appendChild(box);
    log('INFO','Cartão de avisos exibido');
  };
})();

</script>
</body>
</html>
